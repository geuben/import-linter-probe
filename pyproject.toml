[project]
name = "import-linter-probe"
dynamic = ["version"]
description = "Find a contract home for a module you have not written yet, and find the modules no import-linter contract is looking at."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "geuben" }]
requires-python = ">=3.11"
keywords = ["import-linter", "architecture", "layers", "static-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
# Only needed to actually run a probe; the audit is pure config + filesystem.
lint = ["import-linter>=1.12"]

[project.urls]
Homepage = "https://github.com/geuben/import-linter-probe"
Repository = "https://github.com/geuben/import-linter-probe"
Issues = "https://github.com/geuben/import-linter-probe/issues"
Changelog = "https://github.com/geuben/import-linter-probe/blob/main/CHANGELOG.md"

[project.scripts]
import-linter-probe = "import_linter_probe.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "import-linter>=1.12", "zizmor>=1.29"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/import_linter_probe/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/import_linter_probe"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md", "SECURITY.md"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
