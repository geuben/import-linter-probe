[project]
name = "import-linter-probe"
version = "0.1.0"
description = "Find a contract home for a module you have not written yet, and find the modules no import-linter contract is looking at."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["import-linter", "architecture", "layers", "static-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
# Only needed to actually run a probe; the audit is pure config + filesystem.
lint = ["import-linter>=1.12"]

[project.scripts]
import-linter-probe = "import_linter_probe.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "import-linter>=1.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/import_linter_probe"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
